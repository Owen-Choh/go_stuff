<h5>I LOVE CORS!</h5>

<div id="status" style="display: flex; align-items: center;">
    <h5>Server up?</h5>
    <div id="status-color" style="height: 20px; width: 20px; background-color: grey;"></div>
</div>

<input type="submit" value="Start" onclick="submit()">

<script type="text/javascript">
    function submit() {
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                alert(xhr.response);
            }
        }
        xhr.open('GET', 'http://localhost:8080/cors', true);
        // xhr.setRequestHeader('Origin', 'file:///C:/Users/Owen/Desktop/github_stuff/go_stuff/simple_api/index.html');
        xhr.send();
    }

    function checkServer() {
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                alert(xhr.response);
            }
        }
        xhr.open('GET', 'http://localhost:8080/cors', true);
        // xhr.setRequestHeader('Origin', 'file:///C:/Users/Owen/Desktop/github_stuff/go_stuff/simple_api/index.html');
        xhr.send();
    }
    window.onload()
</script>
